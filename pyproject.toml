[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "necro-prune-ast-deadcode-incinerator"
version = "0.2.0"
description = "AST-level static dead code analysis, symbol reachability graph traversal, and zero-compromise incinerator."
readme = "README.md"
authors = [{ name = "Sunzzx" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
necro-prune = "necro_prune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
